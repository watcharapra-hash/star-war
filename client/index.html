<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Board | บอร์ดออนไลน์</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">

</head>
<body>
  
  <header>
    <button id="sidebar-toggle" class="btn-toggle">☰</button> 
    <h1>Play Board</h1>
  </header>

  <div id="app-container">
    <aside id="sidebar">
        <div class="tab-content active" id="tab-rooms">

          <div class="search-container">
              <p>ค้นหาห้อง:</p>
              <input 
                type="text" 
                id="search-input" 
                placeholder=" ค้นหาห้อง... "
                autocomplete="off"
              >
              <div id="search-suggestions" class="search-suggestions"></div>
            
            <div id="category-buttons" class="category-buttons">
              <label for="category-select" class="category-label">หมวดหมู่:</label>
              <br><select id="category-select" class="category-select">
                <option value="">ทั้งหมด</option>
                <option value="คณะวิทยาศาสตร์">คณะวิทยาศาสตร์</option>
                <option value="หอพักนักศึกษา">หอพักนักศึกษา</option>
              </select>
            </div>

          </div>

          <!-- แสดงห้องปัจจุบัน -->
          <div id="current-room-info" class="current-room-box">
              <strong>ห้องปัจจุบัน:</strong>
              <div id="current-room-name" class="current-room-name">ยังไม่ได้เลือก</div>
          </div>

          <!-- รายการห้อง -->
          <div id="room-container" class="room-list">
              <h3>รายการห้อง</h3>
              <p class="loading-text">กำลังโหลดห้อง...</p> 
          </div>
        </div>
    </aside>

    <main id="main-content">

        <div id="board" class="board-canvas">
            <div class="board-header">
                <h2>กระดานสำหรับ: <span id="current-room-name-board">ยังไม่ได้เลือก</span></h2>
                <p class="board-hint">💡 เลือกห้องจากด้านซ้ายเพื่อเริ่มใช้งาน</p>
            </div>
        </div>

        <!-- Controls for Notes -->
        <div id="note-controls" style="display: none;">

            <button id="create-post" class="btn-success">+ สร้างโพสต์ใหม่</button>
            <span class="note-controls-divider"></span>
            <button id="create-note" class="btn-success">+ สร้างโน้ต</button>
            
            <label for="image-input" class="note-btn-upload">อัปโหลดรูปภาพ</label>
            <input type="file" id="image-input" accept="image/*" style="display:none;">
            
            <span class="note-controls-divider"></span>
            
            <button id="align-left" class="btn-align">⬅️</button>
            <button id="align-center" class="btn-align">↔️</button>
            <button id="align-right" class="btn-align">➡️</button>
            
            <span class="note-controls-divider"></span>
            
            <!-- Emoji Picker -->
              <div class="picker-wrapper">
                  <button id="emoji-btn">😊</button>
                  <div id="emoji-dropdown" class="picker-dropdown">
                      <div class="emoji-grid-inline"></div>
                  </div>
              </div>
              
              <!-- Color Picker -->
              <div class="picker-wrapper">
                  <button id="color-picker-btn">🎨</button>
                  <div id="color-dropdown" class="picker-dropdown">
                      <div class="color-grid-inline"></div>
                  </div>
              </div>
        </div>

        
    </main>
  </div>

  <!-- Modal for Creating Post -->
  <div id="post-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>สร้างโพสต์ใหม่</h2>
      <form id="post-form">
        <input type="text" id="post-title" placeholder="หัวข้อ" required>
        <input type="text" id="post-author" placeholder="ผู้โพสต์">
        <textarea id="post-description" placeholder="รายละเอียด" rows="4"></textarea>
        <input type="file" id="post-image" accept="image/*">
        <input type="text" id="post-contact" placeholder="ช่องทางติดต่อ (URL, เบอร์โทร, etc.)">
        <button type="submit" class="btn-primary">สร้างโพสต์</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
